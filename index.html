<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMP Browser Coach</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface: #161b22;
            --text-main: #c9d1d9;
            --muted: #8b949e;
            --accent: #2f81f7;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
            margin: 0;
        }
        .container {
            background-color: var(--surface);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 {
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 1rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        input {
            background-color: var(--bg-color);
            border: 1px solid #30363d;
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background-color: #2ea043; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #30363d;
        }
        td { padding: 0.75rem 0; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SMP Prediction Engine</h2>
        <form id="coachForm2">
            <div class="input-group">
                <label for="h_sleep">Sleep (Hours)</label>
                <input type="number" step="0.1" id="h_sleep" required placeholder="e.g., 7.5">
            </div>
            <div class="input-group">
                <label for="h_water">Water (Glasses)</label>
                <input type="number" id="h_water" required placeholder="e.g., 8">
            </div>
            <div class="input-group">
                <label for="h_steps">Daily Steps</label>
                <input type="number" id="h_steps" required placeholder="e.g., 10500">
            </div>
            <button type="submit">Analyze Metrics</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Sleep</th>
                    <th>Water</th>
                    <th>Steps</th>
                    <th>Status</th>
                    <th>Conf.</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
    <script src="coach.js"></script> 
</body>
</html>
